<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>TEST</title>
</head>

<body style="background:black;color:white;text-align:center">

<h1>Test image</h1>

<img id="img" src="img-vehicule/T-72-1.jpg" style="width:300px">

<br><br>

<button onclick="next()">Suivant</button>

<script>

const images=[
"img-vehicule/T-72-1.jpg",
"img-vehicule/T-72-2.jpg",
"img-vehicule/T-72-3.jpg"
];

let i=0;

function next(){
  i++;
  if(i>=images.length) i=0;
  document.getElementById("img").src = images[i];
}

</script>

</body>
