<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards Véhicules</title>

<style>
body{
  margin:0;
  background:#0f172a;
  color:white;
  text-align:center;
  font-family:Arial;
}

/* PASSWORD */
#passwordOverlay{
  position:fixed;
  inset:0;
  background:black;
  display:flex;
  justify-content:center;
  align-items:center;
}
#passwordBox{
  background:#020617;
  padding:30px;
  border-radius:20px;
}

/* CARD */
.card{
  margin-top:30px;
}

img{
  width:90%;
  max-width:400px;
  height:60vh;
  object-fit:contain;
}

/* BUTTONS */
button{
  padding:12px 20px;
  margin:10px;
  border:none;
  border-radius:10px;
  font-size:18px;
  cursor:pointer;
}

.start{background:#0284c7;color:white}
.good{background:#16a34a}
.bad{background:#dc2626}
</style>
</head>

<body>

<!-- PASSWORD -->
<div id="passwordOverlay">
  <div id="passwordBox">
    <h2>🔒 Mot de passe</h2>
    <input type="password" id="passwordInput">
    <br><br>
    <button onclick="checkPassword()">Valider</button>
  </div>
</div>

<h1>Flashcards Véhicules</h1>

<button class="start" onclick="start()">▶ Démarrer</button>

<div class="card">
  <img id="img">
  <h2 id="name"></h2>
</div>

<div>
  <button class="bad" onclick="bad()">❌ Mauvais</button>
  <button class="good" onclick="good()">✅ Bon</button>
</div>

<script>

/* PASSWORD */
const PASSWORD="1234";
function checkPassword(){
  if(passwordInput.value===PASSWORD){
    passwordOverlay.style.display="none";
  }
}

/* VEHICULES COMPLETS */
const vehicles=[
"T-55","T-62","T-64BV","T-72","T-80","T-90",
"BMP-1","BMP-2","BMP-3",
"BTR-80","BTR-80A",
"M1-ABRAMS","HUMMER","STRYKER",
"LEOPARD-2","FUCHS",
"CHALLENGER-2",
"ARIETE","CENTAURO",
"MAGACH-7C",
"COBRA","ALTAY",
"DRAGON","VEC",
"EAGLE-IV",
"PTL-02"
];

/* GENERATION IMAGES */
const cards=[];
vehicles.forEach(v=>{
  for(let i=1;i<=3;i++){
    cards.push({
      img:`img-vehicule/${v}-${i}.jpg`,
      name:v,
      weight:1
    });
  }
});

let current;

/* RANDOM SIMPLE */
function getRandom(){
  return cards[Math.floor(Math.random()*cards.length)];
}

/* START */
function start(){
  nextCard();
}

/* NEXT */
function nextCard(){
  current=getRandom();
  document.getElementById("img").src=current.img;
  document.getElementById("name").textContent="";
}

/* CLICK IMAGE = SHOW ANSWER */
document.getElementById("img").onclick=()=>{
  document.getElementById("name").textContent=current.name;
};

/* BUTTONS */
function good(){
  nextCard();
}

function bad(){
  nextCard();
}

</script>

</body>
</html>
