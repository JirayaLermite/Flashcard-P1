<title>Flashcards Véhicules</title>

<style>
body{
  margin:0;
  background:#0f172a;
  color:white;
  font-family:Arial;
  text-align:center;
}

/* HEADER */
header{
  background:#020617;
  padding:10px;
}

button{
  padding:10px;
  margin:5px;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

.good{background:#16a34a}
.bad{background:#dc2626}

/* MENU */
#menu{
  display:none;
  flex-direction:column;
  background:#020617;
  padding:10px;
  position:absolute;
  left:10px;
  top:60px;
  border-radius:10px;
}

#menu label{
  margin:5px;
}

/* CARD */
.card{
  width:90vw;
  max-width:400px;
  height:60vh;
  margin:30px auto;
  position:relative;
  transform-style:preserve-3d;
  transition:0.5s;
}

.card.flip{transform:rotateY(180deg)}

.face{
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#020617;
  border-radius:20px;
  overflow:hidden;
  backface-visibility:hidden;
}

.face img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.back{
  transform:rotateY(180deg);
  font-size:22px;
}
</style>
</head>

<body>

<header>
  <button onclick="toggleMenu()">🌍 Pays</button>
  <button onclick="next()">▶ Suivant</button>
</header>

<div id="menu"></div>

<div class="card" id="card">

  <div class="face back" id="back"></div>
</div>

<div>

/* 🧠 TRANSFORM IMAGE → CARTE */
const cards = imageList.map(img=>{
  const name = img.split("-").slice(0,-1).join("-");
  return {
    name:name,
    img:"img-vehicule/" + img,
    weight:1
  };
});

/* 🌍 PAYS (approx simple basé sur nom) */
const countryMap = {
"Russie":["T-","BMP","BTR"],
"USA":["M1-","HUMMER","STRYKER"],
"Allemagne":["LEOPARD","FUCHS"],
};

/* MENU */
const menu=document.getElementById("menu");

Object.keys(countryMap).forEach(c=>{
  const l=document.createElement("label");
  l.innerHTML=`${c} <input type="checkbox" checked value="${c}">`;
  menu.appendChild(l);
});

function toggleMenu(){
  menu.style.display = menu.style.display==="flex"?"none":"flex";
}

/* FILTRE */
function getFiltered(){

  const selected=[...menu.querySelectorAll("input:checked")].map(i=>i.value);

  return cards.filter(c=>{
    return selected.some(country=>{
      return countryMap[country].some(key=>c.name.includes(key));
    });
  });
}

/* 🧠 RANDOM INTELLIGENT */
function getWeighted(list){
  let total=0;
  list.forEach(c=>total+=c.weight);

  let r=Math.random()*total;

  for(let c of list){
    if(r<c.weight) return c;
    r-=c.weight;
  }
}

/* LOAD */
function load(){

  card.classList.remove("flip");

  const list = getFiltered();
  const c = getWeighted(list);

  img.src = c.img;
  back.textContent = c.name;
  current = c;
}

/* BUTTONS */
function good(){
  current.weight=Math.max(1,current.weight-1);
  load();
}

function bad(){
  current.weight+=2;
  load();
}

/* START */
function next(){
  load();
}

card.onclick=()=>card.classList.toggle("flip");

next();
