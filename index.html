<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards Véhicules</title>

<style>
*{box-sizing:border-box;font-family:Arial}

body{
  margin:0;
  background:#0f172a;
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* HEADER */
header{
  width:100%;
  background:#020617;
  padding:10px;
  display:flex;
  justify-content:center;
  gap:10px;
}

button{
  border:none;
  border-radius:12px;
  padding:10px 16px;
  cursor:pointer;
  font-weight:600;
}

.start{background:#0284c7;color:white}
.good{background:#16a34a}
.bad{background:#dc2626}

/* CARD */
.card{
  width:90vw;
  max-width:420px;
  height:60vh;
  margin-top:20px;
  position:relative;
  transform-style:preserve-3d;
  transition:.5s;
}
.card.flip{transform:rotateY(180deg)}

.face{
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#020617;
  border-radius:20px;
  overflow:hidden;
}

.face img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.back{
  transform:rotateY(180deg);
  font-size:24px;
}

/* CONTROLS */
#controls{
  display:flex;
  gap:10px;
  margin:20px;
  width:90%;
  max-width:420px;
}
#controls button{
  flex:1;
  padding:14px;
}
</style>
</head>

<body>

<header>
  <button class="start" onclick="start()">▶ Démarrer</button>
</header>

<div class="card" id="card">
  <div class="face">
    <img id="img">
  </div>
  <div class="face back" id="back"></div>
</div>

<div id="controls">
  <button class="bad" onclick="bad()">❌</button>
  <button class="good" onclick="good()">✅</button>
</div>

<script>

/* 🚀 LISTE COMPLETE */
const vehicles = {

"Russie":[
"T-72","T-80","T-90","BMP-1","BMP-2","BMP-3","BTR-80","BTR-80A",
"T-14-ARMATA","T-15-BALGUNIK","BM-21","BM-27","BM-30","2S1","2S3","2S5","2S7","2S19","2S35",
"ZU-23-2","ZSU-23-4-SHILKA","TUNGUSKA","PANTSIR","TOR-M2","MI-24","MI-28"
],

"USA":[
"M1-ABRAMS","HUMMER","STRYKER","AAV-7","LAV-25","APACHE","M-777","M-109","HIMARS"
],

"Allemagne":[
"LEOPARD-2","FUCHS","BOXER","LYNX","WIESEL"
],

"Royaume-Uni":[
"CHALLENGER-2","SCIMITAR","JACKAL","AS-90","AJAX"
],

"Italie":[
"ARIETE","CENTAURO","CENTAURO-II","FRECCIA","DARDO"
],

"Israël":[
"MAGACH-7C","NAMER","EITAN","ACHZARIT"
],

"Turquie":[
"COBRA","ALTAY","SABRA","AIFV"
],

"Espagne":[
"DRAGON","VEC","BMR-600","VAMTAC"
],

"Suisse":[
"EAGLE-IV","PIRANHA"
],

"Chine":[
"PTL-02","ZTZ-96","ZTZ-99","ZBD-04","ZBD-05"
],

"Japon":[
"TYPE-10"
],

"Corée":[
"K-1","K-2","MERKAVA-IV"
],

"Ukraine":[
"T-64-BULAT","DOZOR","VARTA"
],

"Inde":[
"ARJUN"
],

"Pologne":[
"ROSOMAK","ROSOMAK-RAK","XA-180","XA-360"
]

};

/* 🔥 GENERATEUR FIX */
let baseList = [];

for(const country in vehicles){
  baseList = baseList.concat(vehicles[country]);
}

/* RANDOM */
function getRandomVehicle(){
  return baseList[Math.floor(Math.random()*baseList.length)];
}

let current;

const img=document.getElementById("img");
const back=document.getElementById("back");
const card=document.getElementById("card");

/* LOAD */
function load(){

  card.classList.remove("flip");
  img.src = "";

  function tryLoad(){

    const v = getRandomVehicle();
    const i = Math.floor(Math.random()*3)+1;

    const path = `img-vehicule/${v}-${i}.jpg`;

    const test = new Image();

    test.onload = ()=>{
      img.src = path;
      back.textContent = v;
      current = v;
    };

    test.onerror = ()=>{
      tryLoad(); // 🔁 on change si image inexistante
    };

    test.src = path;
  }

  tryLoad();
}

/* START */
function start(){
  load();
}

/* FLIP */
card.onclick=()=>card.classList.toggle("flip");

/* BUTTONS */
function good(){load();}
function bad(){load();}

</script>

</body>
</html>
