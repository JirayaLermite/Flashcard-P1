<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards Véhicules</title>

<style>
body{
  margin:0;
  background:#0f172a;
  color:white;
  font-family:Arial;
  text-align:center;
}

header{
  background:#020617;
  padding:10px;
}

button{
  padding:10px;
  margin:5px;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

.good{background:#16a34a}
.bad{background:#dc2626}

/* MENU */
#menu{
  display:none;
  flex-direction:column;
  background:#020617;
  padding:10px;
  position:absolute;
  left:10px;
  top:60px;
  border-radius:10px;
}

/* CARD */
.card{
  width:90vw;
  max-width:400px;
  height:60vh;
  margin:30px auto;
  position:relative;
  transform-style:preserve-3d;
  transition:0.5s;
}

.card.flip{transform:rotateY(180deg)}

.face{
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#020617;
  border-radius:20px;
  overflow:hidden;
  backface-visibility:hidden;
}

.face img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.back{
  transform:rotateY(180deg);
  font-size:22px;
}
</style>
</head>

<body>

<header>
  <button onclick="toggleMenu()">🌍 Pays</button>
  <button onclick="next()">▶</button>
</header>

<div id="menu"></div>

<div class="card" id="card">
  <div class="face"><img id="img"></div>
  <div class="face back" id="back"></div>
</div>

<div>
  <button class="bad" onclick="bad()">❌</button>
  <button class="good" onclick="good()">✅</button>
</div>

/* 🔥 CARTES TEST */

/* MENU */
const menu = document.getElementById("menu");
const countries = [...new Set(cards.map(c=>c.country))];

countries.forEach(c=>{
  const l=document.createElement("label");

  const checkbox = document.createElement("input");
  checkbox.type="checkbox";
  checkbox.value=c;
  checkbox.checked=true;

  checkbox.onchange = () => load();

  l.appendChild(document.createTextNode(c+" "));
  l.appendChild(checkbox);

  menu.appendChild(l);
});

function toggleMenu(){
  menu.style.display = menu.style.display==="flex"?"none":"flex";
}

/* FILTRE */
function getFiltered(){
  const selected=[...menu.querySelectorAll("input:checked")].map(i=>i.value);
  return cards.filter(c=>selected.includes(c.country));
}

/* RANDOM INTELLIGENT */
function getWeighted(list){
  let total=0;
  list.forEach(c=>total+=c.weight);

  let r=Math.random()*total;

  for(let c of list){
    if(r<c.weight) return c;
    r-=c.weight;
  }
}

/* LOAD */
let current;

function load(){

  const list = getFiltered();

  if(list.length===0){
    alert("Choisis un pays");
    return;
  }

  const c = getWeighted(list);

  current = c;

  /* 🔥 ON RETOURNE LA CARTE */
  card.classList.remove("flip");

  /* 🔥 ON ATTEND AVANT DE CHANGER */
  setTimeout(()=>{

    img.src = c.img;
    back.textContent = c.name;

  }, 250); // 👈 important
}
  const c = getWeighted(list);

  img.src = c.img;
  back.textContent = c.name;

  current = c;
}

/* FIX FLIP */
function good(){
  current.weight = Math.max(1,current.weight-1);
  load();
}

function bad(){
  current.weight += 2;
  load();
}
