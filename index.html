<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards Véhicules</title>

<style>
body{
  margin:0;
  background:#0f172a;
  color:white;
  font-family:Arial;
  text-align:center;
}

header{background:#020617;padding:10px;}

button{
  padding:10px;margin:5px;
  border:none;border-radius:10px;cursor:pointer;
}

.good{background:#16a34a}
.bad{background:#dc2626}

#menu{
  display:none;
  flex-direction:column;
  background:#020617;
  padding:10px;
  position:absolute;
  left:10px;
  top:60px;
  border-radius:10px;
  max-height:70vh;
  overflow:auto;
}

.card{
  width:90vw;
  max-width:400px;
  height:60vh;
  margin:30px auto;
  position:relative;
  transform-style:preserve-3d;
  transition:0.5s;
}

.card.flip{transform:rotateY(180deg)}

.face{
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#020617;
  border-radius:20px;
  overflow:hidden;
  backface-visibility:hidden;
}

.face img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.back{
  transform:rotateY(180deg);
  font-size:22px;
}
</style>
</head>

<body>

<header>
  <button onclick="toggleMenu()">🌍 Véhicules</button>
  <button onclick="next()">▶</button>
</header>

<div id="menu"></div>

<div class="card" id="card">
  <div class="face"><img id="img"></div>
  <div class="face back" id="back"></div>
</div>

<div>
  <button class="bad" onclick="bad()">❌</button>
  <button class="good" onclick="good()">✅</button>
</div>

<script>

/* 🔥 TA LISTE COMPLETE */
const imageList = [

"T-55-1.jpg","T-55-2.jpg","T-55-3.jpg",
"T-62-1.jpg","T-62-2.jpg","T-62-3.jpg",
"T-64BV-1.jpg","T-64BV-2.jpg","T-64BV-3.jpg",
"T-72-1.jpg","T-72-2.jpg","T-72-3.jpg",
"T-72-B3-1.jpg","T-72-B3-2.jpg","T-72-B3-3.jpg",
"T-80-1.jpg","T-80-2.jpg","T-80-3.jpg",
"T-80-BVM-1.jpg","T-80-BVM-2.jpg","T-80-BVM-3.jpg",
"T-90-1.jpg","T-90-2.jpg","T-90-3.jpg",
"T-90-MS-1.jpg","T-90-MS-2.jpg","T-90-MS-3.jpg",
"T-14-ARMATA-1.jpg","T-14-ARMATA-2.jpg","T-14-ARMATA-3.jpg",
"T-15-BALGUNIK-1.jpg","T-15-BALGUNIK-2.jpg","T-15-BALGUNIK-3.jpg",

"BMP-1-1.jpg","BMP-1-2.jpg","BMP-1-3.jpg",
"BMP-2-1.jpg","BMP-2-2.jpg","BMP-2-3.jpg",
"BMP-3-1.jpg","BMP-3-2.jpg","BMP-3-3.jpg",
"BMP-3-KORNET-T-1.jpg","BMP-3-KORNET-T-2.jpg","BMP-3-KORNET-T-3.jpg",
"BMP3-KHRIZANTEMA-S-1.jpg","BMP3-KHRIZANTEMA-S-2.jpg","BMP3-KHRIZANTEMA-S-3.jpg",

"BTR-60-1.jpg","BTR-60-2.jpg","BTR-60-3.jpg",
"BTR-70-1.jpg","BTR-70-2.jpg","BTR-70-3.jpg",
"BTR-80-1.jpg","BTR-80-2.jpg","BTR-80-3.jpg",
"BTR-80A-1.jpg","BTR-80A-2.jpg","BTR-80A-3.jpg",

"BRDM-2-1.jpg","BRDM-2-2.jpg","BRDM-2-3.jpg",
"BRDM-2-RKH-1.jpg","BRDM-2-RKH-2.jpg","BRDM-2-RKH-3.jpg",
"BRDM-2-AT5-1.jpg","BRDM-2-AT5-2.jpg","BRDM-2-AT5-3.jpg",

"BM-21-1.jpg","BM-21-2.jpg","BM-21-3.jpg",
"BM-27-1.jpg","BM-27-2.jpg","BM-27-3.jpg",
"BM-30-1.jpg","BM-30-2.jpg","BM-30-3.jpg",

"2S1-1.jpg","2S1-2.jpg","2S1-3.jpg",
"2S3-1.jpg","2S3-2.jpg","2S3-3.jpg",
"2S5-1.jpg","2S5-2.jpg","2S5-3.jpg",
"2S7-1.jpg","2S7-2.jpg","2S7-3.jpg",
"2S19-1.jpg","2S19-2.jpg","2S19-3.jpg",
"2S35-1.jpg","2S35-2.jpg","2S35-3.jpg",

"PANTSIR-1.jpg","PANTSIR-2.jpg","PANTSIR-3.jpg",
"TOR-M2-1.jpg","TOR-M2-2.jpg","TOR-M2-3.jpg",
"TUNGUSKA-1.jpg","TUNG
];

/* 🔥 GROUPE AUTOMATIQUE */
const vehicleGroups = {};

imageList.forEach(img=>{
  const name = img.split("-").slice(0,-1).join("-");

  if(!vehicleGroups[name]){
    vehicleGroups[name] = [];
  }

  vehicleGroups[name].push(img);
});

/* 🧠 CARDS */
const cards = Object.keys(vehicleGroups).map(name=>{
  return {
    name:name,
    weight:1
  };
});

/* 🌍 MENU AUTO */
const menu = document.getElementById("menu");

Object.keys(vehicleGroups).forEach(v=>{
  const l=document.createElement("label");
  l.innerHTML=`${v} <input type="checkbox" checked value="${v}">`;
  menu.appendChild(l);
});

function toggleMenu(){
  menu.style.display = menu.style.display==="flex"?"none":"flex";
}

/* FILTRE */
function getFiltered(){
  const selected=[...menu.querySelectorAll("input:checked")].map(i=>i.value);
  return cards.filter(c=>selected.includes(c.name));
}

/* 🧠 RANDOM */
function getWeighted(list){
  let total=0;
  list.forEach(c=>total+=c.weight);
  let r=Math.random()*total;
  for(let c of list){
    if(r<c.weight) return c;
    r-=c.weight;
  }
}

/* ⚡ PRELOAD */
function preloadNext(){
  for(let i=0;i<3;i++){
    const c = cards[Math.floor(Math.random()*cards.length)];
    const imgs = vehicleGroups[c.name];
    const imgPre = new Image();
    imgPre.src = "img-vehicule/" + imgs[Math.floor(Math.random()*imgs.length)];
  }
}

/* LOAD */
let current;

function load(){

  card.classList.remove("flip");

  const list = getFiltered();

  if(list.length === 0){
    alert("Sélectionne au moins un véhicule");
    return;
  }

  const c = getWeighted(list);
  const imgs = vehicleGroups[c.name];

  const randomImg = imgs[Math.floor(Math.random()*imgs.length)];

  img.src = "img-vehicule/" + randomImg;
  back.textContent = c.name;

  current = c;

  preloadNext();
}

/* BUTTONS */
function good(){
  current.weight = Math.max(1,current.weight-1);
  load();
}

function bad(){
  current.weight += 2;
  load();
}

/* START */
function next(){
  load();
}

card.onclick=()=>card.classList.toggle("flip");

setTimeout(next,100);

</script>

</body>
</html>
