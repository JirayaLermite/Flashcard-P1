<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards Véhicules</title>

<style>
*{box-sizing:border-box;font-family:Arial}

body{
  margin:0;
  background:#0f172a;
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* PASSWORD */
#passwordOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.95);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
}
#passwordBox{
  background:#020617;
  padding:30px;
  border-radius:20px;
  text-align:center;
}

/* HEADER */
header{
  width:100%;
  background:#020617;
  padding:10px;
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

button{
  border:none;
  border-radius:14px;
  padding:10px 16px;
  cursor:pointer;
  font-weight:600;
}

.start{background:#0284c7;color:white}
.good{background:#16a34a}
.bad{background:#dc2626}

/* CARD */
.card{
  width:90vw;
  max-width:420px;
  height:60vh;
  margin-top:20px;
  position:relative;
  transform-style:preserve-3d;
  transition:.6s;
}
.card.flip{transform:rotateY(180deg)}

.face{
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#020617;
  border-radius:20px;
  overflow:hidden; /* 🔥 important */
}
.face img{
   border:3px solid red;
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}
.back{
  transform:rotateY(180deg);
  font-size:22px;
}

/* CONTROLS */
#controls{
  display:flex;
  gap:10px;
  margin:20px;
  width:90%;
  max-width:420px;
}
#controls button{
  flex:1;
  padding:14px;
  font-size:18px;
}
</style>
</head>

<body>

<!-- PASSWORD -->
<div id="passwordOverlay">
  <div id="passwordBox">
    <h2>🔒 Accès protégé</h2>
    <input type="password" id="passwordInput">
    <button onclick="checkPassword()">Valider</button>
  </div>
</div>

<header>
  <button class="start" onclick="start()">▶ Démarrer</button>
</header>

<div class="card" id="card">
  <div class="face">
    <img id="img">
  </div>
  <div class="face back" id="back"></div>
</div>

<div id="controls">
  <button class="bad" onclick="bad()">❌</button>
  <button class="good" onclick="good()">✅</button>
</div>

<script>

/* PASSWORD */
const PASSWORD="1234";
function checkPassword(){
  if(passwordInput.value===PASSWORD){
    passwordOverlay.style.display="none";
  }
}

/* VEHICULES (liste complète possible ici) */
const vehicles=[
"T-72","T-80","T-90",
"BMP-1","BMP-2","BMP-3",
"BTR-80","BTR-80A",
"M1-ABRAMS","HUMMER","STRYKER",
"LEOPARD-2","FUCHS",
"CHALLENGER-2",
"ARIETE","CENTAURO",
"MAGACH-7C",
"COBRA","ALTAY",
"DRAGON","VEC",
"EAGLE-IV",
"PTL-02",
"GECKO","GADFLY","GROUSE"
];

/* GENERATION */
const cards=[];
vehicles.forEach(v=>{
  for(let i=1;i<=3;i++){
    cards.push({
      img:`img-vehicule/${v}-${i}.jpg`,
      name:v,
      weight:1
    });
  }
});

let current;
const img=document.getElementById("img");
const back=document.getElementById("back");
const card=document.getElementById("card");

/* RANDOM */
function getRandom(){
  return cards[Math.floor(Math.random()*cards.length)];
}

/* START */
function start(){
  load();
}

/* 🔥 LOAD SAFE */
function load(){
  card.classList.remove("flip");
  img.src = "";

  function tryLoad(){
    current = getRandom();

    const test = new Image();

    test.onload = ()=>{
      img.src = current.img;
      back.textContent = current.name;
    };

    test.onerror = ()=>{
      tryLoad(); // 🔁 continue jusqu'à image valide
    };

    test.src = current.img;
  }

  tryLoad();
}

/* FLIP */
card.onclick=()=>card.classList.toggle("flip");

/* ACTIONS */
function good(){load();}
function bad(){load();}

</script>

</body>
</html>
