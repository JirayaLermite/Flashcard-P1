<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards Véhicules</title>

<style>
*{box-sizing:border-box;font-family:Arial}
body{
  margin:0;
  background:#0f172a;
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* HEADER */
header{
  width:100%;
  background:#020617;
  padding:10px;
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

button{
  border:none;
  border-radius:14px;
  padding:10px 16px;
  cursor:pointer;
  font-weight:600;
}

.start{background:#0284c7;color:white}
.good{background:#16a34a}
.bad{background:#dc2626}
#countryBtn{background:#6366f1}
#fullscreenBtn{background:#9333ea}

/* MENU */
#countryMenu{
  position:absolute;
  top:60px;
  left:10px;
  background:#020617;
  padding:10px;
  border-radius:16px;
  display:none;
  flex-direction:column;
  gap:6px;
}
#countryMenu label{
  display:flex;
  justify-content:space-between;
  background:#1e293b;
  padding:8px;
  border-radius:10px;
}

/* CARD */
.card{
  width:90vw;
  max-width:420px;
  height:60vh;
  margin-top:20px;
  position:relative;
  transform-style:preserve-3d;
  transition:.6s;
}
.card.flip{transform:rotateY(180deg)}

.face{
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#020617;
  border-radius:20px;
}
.face img{
  max-width:100%;
  max-height:100%;
  object-fit:contain;
}
.back{
  transform:rotateY(180deg);
  font-size:22px;
}

/* CONTROLS */
#controls{
  display:flex;
  gap:10px;
  margin:20px;
  width:90%;
  max-width:420px;
}
#controls button{flex:1;padding:14px;font-size:18px}
</style>
</head>

<body>

<header>
  <button id="countryBtn" onclick="toggleMenu()">🌍 Pays</button>
  <button class="start" onclick="start()">▶ Démarrer</button>
  <button id="fullscreenBtn" onclick="toggleFullscreen()">⛶ Plein écran</button>
</header>

<div id="countryMenu"></div>

<div class="card" id="card">
  <div class="face"><img id="img"></div>
  <div class="face back" id="back"></div>
</div>

<div id="controls">
  <button class="bad" onclick="bad()">❌</button>
  <button class="good" onclick="good()">✅</button>
</div>

<script>

/* VEHICULES CORRIGÉS (match fichiers) */
const vehicles={
"Russie":[
"T-72","T-80","T-90",
"BMP-T","BMP-T2","BMP-T72",
"BMP-1","BMP-2","BMP-3",
"BMD-1","BMD-2","BMD-3","BMD-4",
"BTR-80","BTR-80A",
"T-72-B3","T-80-BVM","T-90-MS",
"MI-24","MI-28","TUNGUSKA","PANTSIR"
],
"USA":[
"M1-ABRAMS","HUMMER","STRYKER","M-113",
"AAV-7","LAV-25","APACHE","HIMARS"
],
"Allemagne":[
"LEOPARD-2","FUCHS","WIESEL","BOXER"
],
"Royaume-Uni":[
"CHALLENGER-2","SCIMITAR","JACKAL"
],
"Italie":[
"ARIETE","CENTAURO","IVECO"
],
"Israël":[
"MAGACH-7C","NAMER"
],
"Turquie":[
"COBRA","ALTAY"
],
"Espagne":[
"DRAGON","VEC","BMR-600"
],
"Suisse":[
"EAGLE-IV"
],
"Chine":[
"PTL-02","ZTZ-96","ZTZ-99"
]
};

/* MENU */
const menu=document.getElementById("countryMenu");
Object.keys(vehicles).forEach(c=>{
  const label=document.createElement("label");
  label.innerHTML=`${c} <input type="checkbox" checked value="${c}">`;
  menu.appendChild(label);
});

function toggleMenu(){
  menu.style.display=menu.style.display==="flex"?"none":"flex";
}

document.addEventListener("click",(e)=>{
  if(!menu.contains(e.target)&&e.target.id!=="countryBtn"){
    menu.style.display="none";
  }
});

/* CARDS */
const cards=[];
for(const country in vehicles){
  vehicles[country].forEach(v=>{
    for(let i=1;i<=3;i++){
      cards.push({
        img:`img-vehicule/${v}-${i}.jpg`,
        name:v,
        country,
        weight:1
      });
    }
  });
}

/* LOGIQUE */
let current;
const card=document.getElementById("card");
const img=document.getElementById("img");
const back=document.getElementById("back");

function getRandom(){
  let pool=[];
  cards.forEach(c=>{
    for(let i=0;i<c.weight;i++) pool.push(c);
  });
  return pool[Math.floor(Math.random()*pool.length)];
}

function start(){load();}

function load(){
  card.classList.remove("flip");
  current=getRandom();
  loadImage(current);
}

/* 🔥 ANTI BUG TOTAL */
function loadImage(cardObj){
  img.src=cardObj.img;

  img.onload=()=>{
    back.textContent=cardObj.name;
  };

  img.onerror=()=>{
    console.log("Image ignorée:",cardObj.img);
    current=getRandom();
    loadImage(current);
  };
}

card.onclick=()=>card.classList.toggle("flip");

function good(){
  current.weight=Math.max(1,current.weight-1);
  setTimeout(()=>{card.classList.remove("flip");setTimeout(load,400);},600);
}

function bad(){
  current.weight+=2;
  setTimeout(()=>{card.classList.remove("flip");setTimeout(load,400);},600);
}

function toggleFullscreen(){
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen();
  }else{
    document.exitFullscreen();
  }
}

</script>

</body>
</html>
