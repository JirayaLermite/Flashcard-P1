<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards Véhicules</title>

<style>
body{
  margin:0;
  background:#0f172a;
  color:white;
  font-family:Arial;
  text-align:center;
}

/* HEADER */
header{
  background:#020617;
  padding:10px;
}

button{
  padding:10px;
  margin:5px;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

.good{background:#16a34a}
.bad{background:#dc2626}

/* MENU */
#menu{
  display:none;
  flex-direction:column;
  background:#020617;
  padding:10px;
  position:absolute;
  left:10px;
  top:60px;
  border-radius:10px;
}

#menu label{
  margin:5px;
}

/* CARD */
.card{
  width:90vw;
  max-width:400px;
  height:60vh;
  margin:30px auto;
  position:relative;
  transform-style:preserve-3d;
  transition:0.5s;
}

.card.flip{transform:rotateY(180deg)}

.face{
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#020617;
  border-radius:20px;
  overflow:hidden;

  backface-visibility:hidden;
}

.face img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.back{
  transform:rotateY(180deg);
  font-size:22px;
}
</style>
</head>

<body>

<header>
  <button onclick="toggleMenu()">🌍 Pays</button>
  <button onclick="next()">▶ Suivant</button>
</header>

<div id="menu"></div>

<div class="card" id="card">
  <div class="face"><img id="img"></div>
  <div class="face back" id="back"></div>
</div>

<div>
  <button class="bad" onclick="bad()">❌</button>
  <button class="good" onclick="good()">✅</button>
</div>

<script>

/* 🔥 LISTE COMPLETE */
const vehicles = {
"Russie":["T-72","T-80","T-90","BMP-1","BMP-2","BMP-3","BTR-80","BTR-80A","T-14-ARMATA","BM-21","BM-27","BM-30","2S1","2S3","2S19","PANTSIR","TOR-M2","TUNGUSKA"],
"USA":["M1-ABRAMS","HUMMER","STRYKER","AAV-7","LAV-25","APACHE","M-777","M-109","HIMARS"],
"Allemagne":["LEOPARD-2","FUCHS","BOXER","LYNX","WIESEL"],
"Royaume-Uni":["CHALLENGER-2","SCIMITAR","JACKAL","AS-90","AJAX"],
"Italie":["ARIETE","CENTAURO","CENTAURO-II","FRECCIA","DARDO"],
"Israël":["MAGACH-7C","NAMER","EITAN","ACHZARIT"],
"Turquie":["COBRA","ALTAY","SABRA","AIFV"],
"Espagne":["DRAGON","VEC","BMR-600","VAMTAC"],
"Suisse":["EAGLE-IV","PIRANHA"],
"Chine":["PTL-02","ZTZ-96","ZTZ-99","ZBD-04","ZBD-05"],
"Japon":["TYPE-10"],
"Corée":["K-1","K-2"],
"Ukraine":["T-64-BULAT","DOZOR","VARTA"],
"Inde":["ARJUN"],
"Pologne":["ROSOMAK","ROSOMAK-RAK","XA-180","XA-360"]
};

/* MENU */
const menu=document.getElementById("menu");

Object.keys(vehicles).forEach(c=>{
  const l=document.createElement("label");
  l.innerHTML=`${c} <input type="checkbox" checked value="${c}">`;
  menu.appendChild(l);
});

function toggleMenu(){
  menu.style.display = menu.style.display==="flex"?"none":"flex";
}

document.addEventListener("click",(e)=>{
  if(!menu.contains(e.target)&&e.target.innerText!=="🌍 Pays"){
    menu.style.display="none";
  }
});

/* 🔥 BUILD LIST */
let cards=[];

function buildCards(){
  cards=[];
  const selected=[...menu.querySelectorAll("input:checked")].map(i=>i.value);

  selected.forEach(c=>{
    vehicles[c].forEach(v=>{
      cards.push({
        name:v,
        weight:1
      });
    });
  });
}

/* 🧠 RANDOM INTELLIGENT */
function getWeighted(){
  let total=0;
  cards.forEach(c=>total+=c.weight);

  let r=Math.random()*total;

  for(let c of cards){
    if(r<c.weight) return c;
    r-=c.weight;
  }
}

/* LOAD IMAGE SAFE */
function load(){

  card.classList.remove("flip");

  function tryLoad(){

    const c=getWeighted();
    const i=Math.floor(Math.random()*3)+1;

    const path=`img-vehicule/${c.name}-${i}.jpg`;

    const test=new Image();

    test.onload=()=>{
      img.src=path;
      back.textContent=c.name;
      current=c;
    };

    test.onerror=()=>{
      tryLoad();
    };

    test.src=path;
  }

  tryLoad();
}

/* BUTTONS */
function good(){
  current.weight=Math.max(1,current.weight-1);
  load();
}

function bad(){
  current.weight+=2;
  load();
}

/* START */
function next(){
  buildCards();
  load();
}

card.onclick=()=>card.classList.toggle("flip");

next();

</script>

</body>
</html>
