<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards Véhicules</title>

<style>
body{
  margin:0;
  background:#0f172a;
  color:white;
  font-family:Arial;
  text-align:center;
}

/* HEADER */
header{
  background:#020617;
  padding:10px;
}

button{
  padding:10px;
  margin:5px;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

.good{background:#16a34a}
.bad{background:#dc2626}

/* MENU */
#menu{
  display:none;
  flex-direction:column;
  background:#020617;
  padding:10px;
  position:absolute;
  left:10px;
  top:60px;
  border-radius:10px;
}

#menu label{
  margin:5px;
}

/* CARD */
.card{
  width:90vw;
  max-width:400px;
  height:60vh;
  margin:30px auto;
  position:relative;
  transform-style:preserve-3d;
  transition:0.5s;
}

.card.flip{
  transform:rotateY(180deg);
}

.face{
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#020617;
  border-radius:20px;
  overflow:hidden;
}

.face img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.back{
  transform:rotateY(180deg);
  font-size:22px;
}

/* CONTROLS */
.controls{
  margin-top:10px;
}
</style>
</head>

<body>

<header>
  <button onclick="toggleMenu()">🌍 Pays</button>
  <button onclick="next()">▶ Suivant</button>
</header>

<div id="menu"></div>

<div class="card" id="card">
  <div class="face">
    <img id="img">
  </div>
  <div class="face back" id="back"></div>
</div>

<div class="controls">
  <button class="bad" onclick="next()">❌</button>
  <button class="good" onclick="next()">✅</button>
</div>

/* MENU */
const menu=document.getElementById("menu");

Object.keys(vehicles).forEach(country=>{
  const label=document.createElement("label");
  label.innerHTML=`${country} <input type="checkbox" checked value="${country}">`;
  menu.appendChild(label);
});

function toggleMenu(){
  menu.style.display = menu.style.display==="flex" ? "none" : "flex";
}

/* CLICK OUTSIDE */
document.addEventListener("click",(e)=>{
  if(!menu.contains(e.target) && e.target.innerText!=="🌍 Pays"){
    menu.style.display="none";
  }
});

/* LISTE ACTIVE */
let activeList=[];

function updateList(){
  activeList=[];
  const selected=[...menu.querySelectorAll("input:checked")].map(i=>i.value);

  selected.forEach(c=>{
    activeList = activeList.concat(vehicles[c]);
  });
}

/* CARD */
let current;
const img=document.getElementById("img");
const back=document.getElementById("back");
const card=document.getElementById("card");

function next(){

  updateList();

  if(activeList.length===0){
    alert("Sélectionne au moins un pays");
    return;
  }

  card.classList.remove("flip");

  const v = activeList[Math.floor(Math.random()*activeList.length)];

  current = v;

  img.src = v.img;
  back.textContent = v.name;
}

/* FLIP */
card.onclick=()=>card.classList.toggle("flip");

/* START */
next();

</script>
