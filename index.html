<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards Véhicules</title>

<style>
body{
  margin:0;
  background:#0f172a;
  color:white;
  font-family:Arial;
  text-align:center;
}

header{
  background:#020617;
  padding:10px;
}

button{
  padding:10px;
  margin:5px;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

.good{background:#16a34a}
.bad{background:#dc2626}

#menu{
  display:none;
  flex-direction:column;
  background:#020617;
  padding:10px;
  position:absolute;
  left:10px;
  top:60px;
  border-radius:10px;
}

.card{
  width:90vw;
  max-width:400px;
  height:60vh;
  margin:30px auto;
  position:relative;
  transform-style:preserve-3d;
  transition:0.5s;
}

.card.flip{transform:rotateY(180deg)}

.face{
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#020617;
  border-radius:20px;
  overflow:hidden;
  backface-visibility:hidden;
}

.face img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.back{
  transform:rotateY(180deg);
  font-size:22px;
}
</style>
</head>

<body>

<header>
  <button onclick="toggleMenu()">🌍 Pays</button>
  <button onclick="next()">▶</button>
</header>

<div id="menu"></div>

<div class="card" id="card">
  <div class="face"><img id="img"></div>
  <div class="face back" id="back"></div>
</div>

<div>
  <button class="bad" onclick="bad()">❌</button>
  <button class="good" onclick="good()">✅</button>
</div>

<script>

/* 🔥 TA LISTE COMPLETE */
const imageList = [

/* 👉 COLLE TA LISTE COMPLETE ICI */
"T-72-1.jpg","T-72-2.jpg","T-72-3.jpg"

];

/* 🔥 GROUP VEHICULE */
const vehicleGroups = {};

imageList.forEach(img=>{
  const name = img.split("-").slice(0,-1).join("-");

  if(!vehicleGroups[name]){
    vehicleGroups[name] = [];
  }

  vehicleGroups[name].push(img);
});

/* 🌍 GROUP PAYS (léger) */
const countryMap = {
"Russie":["T-","BMP","BTR","BM","2S","MI","TOR","PANTSIR","TUNGUSKA"],
"USA":["M1","HUMMER","STRYKER","AAV","LAV","APACHE","HIMARS"],
"Europe":["LEOPARD","FUCHS","BOXER","LYNX","WIESEL","CHALLENGER","SCIMITAR","ARIETE","CENTAURO"],
"Autres":["TYPE","K-","ZTZ","ZBD","PTL","ARJUN","ROSOMAK"]
};

/* MENU */
const menu=document.getElementById("menu");

Object.keys(countryMap).forEach(c=>{
  const l=document.createElement("label");
  l.innerHTML=`${c} <input type="checkbox" checked value="${c}">`;
  menu.appendChild(l);
});

function toggleMenu(){
  menu.style.display = menu.style.display==="flex"?"none":"flex";
}

/* FILTRE */
function getFilteredVehicles(){
  const selected=[...menu.querySelectorAll("input:checked")].map(i=>i.value);

  return Object.keys(vehicleGroups).filter(name=>{
    return selected.some(country=>{
      return countryMap[country].some(k=>name.includes(k));
    });
  });
}

/* 🧠 POIDS */
let weights = {};

/* RANDOM */
function getRandomVehicle(list){

  let total=0;

  list.forEach(v=>{
    weights[v] = weights[v] || 1;
    total += weights[v];
  });

  let r=Math.random()*total;

  for(let v of list){
    if(r<weights[v]) return v;
    r-=weights[v];
  }
}

/* ⚡ PRELOAD */
function preloadNext(){
  for(let i=0;i<3;i++){
    const names = Object.keys(vehicleGroups);
    const v = names[Math.floor(Math.random()*names.length)];
    const imgs = vehicleGroups[v];

    const imgPre = new Image();
    imgPre.src = "img-vehicule/" + imgs[Math.floor(Math.random()*imgs.length)];
  }
}

/* LOAD */
let current;

function load(){

  card.classList.remove("flip");

  const filtered = getFilteredVehicles();

  if(filtered.length===0){
    alert("Choisis un pays");
    return;
  }

  const v = getRandomVehicle(filtered);
  const imgs = vehicleGroups[v];

  const imgFile = imgs[Math.floor(Math.random()*imgs.length)];

  img.src = "img-vehicule/" + imgFile;
  back.textContent = v;

  current = v;

  preloadNext();
}

/* BUTTONS */
function good(){
  weights[current] = Math.max(1,(weights[current]||1)-1);
  load();
}

function bad(){
  weights[current] = (weights[current]||1)+2;
  load();
}

function next(){ load(); }

card.onclick=()=>card.classList.toggle("flip");

setTimeout(next,100);

</script>

</body>
</html>
