<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards Véhicules</title>

<style>
body{
  margin:0;
  background:#0f172a;
  color:white;
  font-family:Arial;
  text-align:center;
}

header{
  background:#020617;
  padding:10px;
}

button{
  padding:10px;
  margin:5px;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

.good{background:#16a34a}
.bad{background:#dc2626}

#menu{
  display:none;
  flex-direction:column;
  background:#020617;
  padding:10px;
  position:absolute;
  left:10px;
  top:60px;
  border-radius:10px;
}

/* CARD */
.card{
  width:90vw;
  max-width:400px;
  height:60vh;
  margin:30px auto;
  position:relative;
  transform-style:preserve-3d;
  transition:0.5s;
}

.card.flip{transform:rotateY(180deg)}

.face{
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#020617;
  border-radius:20px;
  overflow:hidden;
  backface-visibility:hidden;
}

.face img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.back{
  transform:rotateY(180deg);
  font-size:22px;
}
</style>
</head>

<body>

<header>
  <button onclick="toggleMenu()">🌍 Pays</button>
  <button onclick="next()">▶</button>
</header>

<div id="menu"></div>

<div class="card" id="card">
  <div class="face"><img id="img"></div>
  <div class="face back" id="back"></div>
</div>

<div>
  <button class="bad" onclick="bad()">❌</button>
  <button class="good" onclick="good()">✅</button>
</div>

<script>

/* 🔥 CARTES TEST */
const cards = [

{img:"img-vehicule/T-72-1.jpg", name:"T-72", country:"Russie", weight:1},
{img:"img-vehicule/T-80-1.jpg", name:"T-80", country:"Russie", weight:1},
{img:"img-vehicule/T-90-1.jpg", name:"T-90", country:"Russie", weight:1},

{img:"img-vehicule/M1-ABRAMS-1.jpg", name:"M1-ABRAMS", country:"USA", weight:1},
{img:"img-vehicule/HUMMER-1.jpg", name:"HUMMER", country:"USA", weight:1},
{img:"img-vehicule/STRYKER-1.jpg", name:"STRYKER", country:"USA", weight:1}

];

/* MENU */
const menu = document.getElementById("menu");
const countries = [...new Set(cards.map(c=>c.country))];

countries.forEach(c=>{
  const l=document.createElement("label");

  const checkbox = document.createElement("input");
  checkbox.type="checkbox";
  checkbox.value=c;
  checkbox.checked=true;

  checkbox.onchange = () => load();

  l.appendChild(document.createTextNode(c+" "));
  l.appendChild(checkbox);

  menu.appendChild(l);
});

function toggleMenu(){
  menu.style.display = menu.style.display==="flex"?"none":"flex";
}

/* FILTRE */
function getFiltered(){
  const selected=[...menu.querySelectorAll("input:checked")].map(i=>i.value);
  return cards.filter(c=>selected.includes(c.country));
}

/* RANDOM SIMPLE */
function getRandom(list){
  return list[Math.floor(Math.random()*list.length)];
}

/* LOAD SIMPLE (ANTI FREEZE) */
let current;

function load(){

  const list = getFiltered();

  if(list.length===0){
    alert("Choisis un pays");
    return;
  }

  const c = getRandom(list);

  /* reset flip AVANT */
  card.classList.remove("flip");

  /* change direct */
  img.src = c.img;
  back.textContent = c.name;

  current = c;
}

/* BUTTONS */
function good(){
  load();
}

function bad(){
  load();
}

function next(){
  load();
}

card.onclick=()=>card.classList.toggle("flip");

setTimeout(next,100);

</script>

</body>
</html>
